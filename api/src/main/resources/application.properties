spring.application.name=ainalyzing-api

# Local dev convenience: read KEY=value pairs from the repo-root .env (gitignored) when running from api/.
# Real environment variables always win, so Docker Compose and the VPS are unaffected.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ainalyzing}
spring.datasource.username=${DB_USER:ainalyzing}
spring.datasource.password=${DB_PASSWORD:ainalyzing}
# Start even when PostgreSQL is briefly down; /api/health then answers 503 and demo calls 503 DB_UNAVAILABLE.
spring.datasource.hikari.connection-timeout=3000

# NFR-02: CSV up to 1 MiB, session data lives 30 minutes
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true behind Caddy/HTTPS (set COOKIE_SECURE=true in the VPS .env)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
app.analysis.ttl=30m

# Behind Caddy: trust X-Forwarded-* so redirects and cookies see https.
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never

# Groq (llm package). Without GROQ_API_KEY the app still runs and answers with local templates (status fallback).
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
# Deadline for a whole insight or chat turn, all Groq requests included (LLM Architecture §3: 5 s).
groq.timeout-ms=${GROQ_TIMEOUT_MS:5000}
# Protects the shared key: beyond this many Groq requests per minute the app answers with templates.
groq.max-calls-per-minute=${GROQ_MAX_CALLS_PER_MINUTE:20}
# Demand sources whose (aggregated) facts may be sent to Groq. See docs/decisions.md D-09.
groq.egress-sources=${GROQ_EGRESS_SOURCES:demo,manual,csv}

# Log codes and ids only (Convention §4). The request id comes from RequestIdFilter.
logging.pattern.level=%5p [%X{requestId:-}]
